<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Assistente</title>
<style>
  :root {
    --fundo: #05070c;
    --ouro: #d9ac5a;
    --texto: #dbe6ff;
    /* Cores da íris: mudam conforme o estado (ver body.pensando e body.falando) */
    --brilho: #2bd3f2;
    --fibra: #5fe6ff;
    --medio: #0d7fa6;
    --base: #0b5e78;
    --escuro: #06344f;
    --aura: #2fd4ff;
    --aura2: #1b6fa8;
    --nivel: 0; /* volume da voz captada, de 0 a 1 */
    --mudo: #ff6b6b; /* microfone desligado pelo botão */
  }
  /* Jarvis: destaque azul em vez de dourado */
  html[data-visual="esfera"] { --ouro: #35d6ff; }

  /* Voz sendo captada */
  body.ouvindo.voz {
    --brilho: #b18cff; --fibra: #dcc8ff; --medio: #6a3fc4; --base: #4b2a96;
    --escuro: #24124f; --aura: #a87bff; --aura2: #5a2fb0;
  }
  body.pensando {
    --brilho: #ffb648; --fibra: #ffd98a; --medio: #b5701a; --base: #7a4a10;
    --escuro: #3f2506; --aura: #ffb020; --aura2: #a8651b;
  }
  body.falando {
    --brilho: #52f2a8; --fibra: #a4ffd2; --medio: #128a5c; --base: #0d6647;
    --escuro: #063a29; --aura: #5dffb2; --aura2: #1ba873;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center;
    background: var(--fundo); color: var(--texto);
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  h1 {
    margin: 18px 0 4px; font-size: 20px; font-weight: 600;
    letter-spacing: .5em; text-indent: .5em; color: var(--ouro);
  }
  #palco { width: 100%; flex: 0 1 auto; min-height: 0; }
  #palco.abrindo { animation: abrir .7s cubic-bezier(.2, .8, .2, 1); }
  @keyframes abrir { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
  svg { display: block; width: 100%; height: auto; max-height: 56vh; }
  #esfera { display: none; width: 100%; height: 52vh; }
  html[data-visual="esfera"] #palco svg { display: none; }
  html[data-visual="esfera"] #esfera { display: block; }

  /* O fundo do SVG sai para o olho se misturar com a janela */
  #fundo { display: none; }

  /* Liga as cores fixas do SVG às variáveis acima */
  stop[stop-color="#2bd3f2"] { stop-color: var(--brilho); }
  stop[stop-color="#0d7fa6"] { stop-color: var(--medio); }
  stop[stop-color="#06344f"] { stop-color: var(--escuro); }
  stop[stop-color="#2fd4ff"] { stop-color: var(--aura); }
  stop[stop-color="#1b6fa8"] { stop-color: var(--aura2); }
  line[stroke="#5fe6ff"] { stroke: var(--fibra); }
  line[stroke="#0b5e78"] { stroke: var(--base); }
  circle[fill="#25cdf5"] { fill: var(--brilho); }
  circle[stroke="#66e8ff"] { stroke: var(--fibra); }

  /* A aura pulsa enquanto ele fala */
  circle[fill="url(#auraGrad)"] { transform-box: fill-box; transform-origin: center; }
  body.falando circle[fill="url(#auraGrad)"] { animation: pulsar .7s ease-in-out infinite alternate; }
  @keyframes pulsar { from { transform: scale(.94); } to { transform: scale(1.04); } }

  /* A pupila dilata e o brilho da íris cresce com o volume da voz */
  #pupila { transform-box: fill-box; transform-origin: center; transition: transform .09s linear; }
  body.ouvindo.voz #pupila { transform: scale(calc(1 + var(--nivel) * .55)); }
  body.ouvindo.voz circle[fill="#25cdf5"] { opacity: calc(.6 + var(--nivel) * .4); }

  #ondas { display: block; width: 100%; height: 110px; flex: none; }
  #status {
    flex: none; font-size: 14px; letter-spacing: .04em; color: #8a97b3; text-align: center;
  }
  body.ouvindo.voz #status { color: var(--fibra); }

  /* A conversa: o que a pessoa disse e, embaixo, o que o assistente respondeu */
  #legenda {
    flex: 1; width: 100%; padding: 10px 36px 14px; overflow-y: auto; min-height: 0;
    font-size: 18px; line-height: 1.45; text-align: center;
  }
  #fala-assistente { margin-top: 12px; font-size: 16px; color: #b9c6e4; }
  #fala-assistente:empty { display: none; }
  #fala-assistente .quem {
    display: block; margin-bottom: 2px; font-size: 11.5px; font-weight: 600; letter-spacing: .14em;
    color: var(--ouro);
  }
  .icone {
    position: fixed; top: 12px; right: 14px; width: 34px; height: 34px; padding: 6px;
    border: 0; border-radius: 8px; background: transparent; color: #8a97b3; cursor: pointer;
  }
  #raciocinio { right: 54px; }
  #microfone { right: 94px; }
  #microfone .risco { display: none; }
  html.mudo #microfone { color: var(--mudo); }
  html.mudo #microfone .risco { display: inline; }
  html.mudo #status { color: var(--mudo); }
  .icone:hover { color: var(--texto); background: #0d111b; }
  .icone:focus-visible { outline: 2px solid var(--ouro); outline-offset: 1px; }
  .icone svg { width: 100%; height: 100%; max-height: none; }

  /* Em espera, numa bolinha no canto da tela: só a esfera, que ativa o assistente com um clique */
  /* Em espera: a bolinha (120 px) em cima e, embaixo, o nome do assistente numa faixa arredondada.
     As medidas batem com o recorte da janela (merlin/interface/moldura.py: LADO_COMPACTO, ESPACO_NOME, ALTURA_NOME) */
  html.compacto body { justify-content: flex-start; cursor: pointer; }
  html.compacto :is(h1, #ondas, #status, #legenda) { display: none; }
  html.compacto #palco { flex: none; width: 120px; height: 120px; }
  html.compacto #esfera { height: 100%; }
  html.compacto #palco svg { height: 100%; max-height: none; }
  #nome-compacto { display: none; }
  /* Em volta da bolinha, do lado de fora: os botões redondos (a posição vem de merlin/interface/moldura.py) */
  html.compacto .icone {
    padding: 6px; border-radius: 50%; color: var(--ouro);
    background: #0b0f18; border: 1px solid color-mix(in srgb, var(--ouro) 45%, transparent);
  }
  html.compacto .icone:hover { background: #141a28; border-color: var(--ouro); }
  html.compacto.mudo #microfone { color: var(--mudo); border-color: var(--mudo); }
  html.compacto #nome-compacto {
    display: block; flex: none; width: 100%; height: 24px; margin-top: 4px; padding: 0 10px;
    line-height: 24px; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .12em;
    color: var(--ouro); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <h1 id="titulo"></h1>
  <div id="palco"><!--OLHO--><canvas id="esfera" aria-label="Esfera do assistente"></canvas>
  </div>
  <div id="nome-compacto" aria-hidden="true"></div>
  <canvas id="ondas" aria-hidden="true"></canvas>
  <div id="status">Aguardando sua voz</div>
  <div id="legenda">
    <div id="fala-pessoa" aria-live="polite"></div>
    <div id="fala-assistente" aria-live="polite"></div>
  </div>
  <button id="microfone" class="icone" type="button" title="Desligar o microfone" aria-label="Desligar o microfone" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/>
      <path class="risco" d="M4 4l16 16"/>
    </svg>
  </button>
  <button id="raciocinio" class="icone" type="button" title="Raciocínio da IA" aria-label="Abrir o raciocínio da IA">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 6h16M4 12h10M4 18h7"/>
      <circle cx="17.5" cy="16.5" r="3"/>
      <path d="m19.7 18.7 2 2"/>
    </svg>
  </button>
  <button id="engrenagem" class="icone" type="button" title="Configurações" aria-label="Abrir configurações">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

<!--SCRIPTS-->

<script>
  const palco = document.getElementById("palco");
  const legenda = document.getElementById("legenda");
  const dados = /*DADOS*/;

  const titulo = document.getElementById("titulo");
  const canvasEsfera = document.getElementById("esfera");
  let visual = "olho";
  let janelaVisivel = false;

  document.getElementById("engrenagem").addEventListener("click", () => window.pywebview.api.abrir_configuracoes());
  document.getElementById("raciocinio").addEventListener("click", () => window.pywebview.api.abrir_raciocinio());

  // Mudo: o Python decide e devolve o estado novo, para o botão nunca mostrar o contrário do que está valendo
  const botaoMicrofone = document.getElementById("microfone");
  let microfoneMudo = false;
  function definirMudo(mudo) {
    microfoneMudo = mudo;
    document.documentElement.classList.toggle("mudo", mudo);
    const texto = mudo ? "Ligar o microfone" : "Desligar o microfone";
    botaoMicrofone.title = texto;
    botaoMicrofone.setAttribute("aria-label", texto);
    botaoMicrofone.setAttribute("aria-pressed", String(mudo));
    if (mudo) definirNivel(0);
    atualizarStatus();
  }
  botaoMicrofone.addEventListener("click", async () => definirMudo(await window.pywebview.api.alternar_microfone()));

  function definirPersonalidade(p) {
    visual = p.visual;
    document.documentElement.dataset.visual = p.visual;
    // Cor de destaque escolhida no configurador; sem ela, vale a cor padrão do visual
    if (p.cor) document.documentElement.style.setProperty("--ouro", p.cor);
    else document.documentElement.style.removeProperty("--ouro");
    titulo.textContent = p.nome.toUpperCase();
    document.getElementById("nome-compacto").textContent = p.nome.toUpperCase();
    document.title = p.nome;
    if (visual === "esfera" && !window.Esfera.ok) window.Esfera.iniciar(canvasEsfera);
    atualizarAnimacao();
  }
  // A esfera só é desenhada quando aparece na tela
  function atualizarAnimacao() {
    if (visual === "esfera" && janelaVisivel) window.Esfera.ligar();
    else window.Esfera.desligar();
  }
  function falarComVolume(volumes, passo) {
    window.Esfera.falar(volumes, passo);
  }

  const statusTexto = document.getElementById("status");
  let estadoAtual = "ouvindo";
  let nivelAtual = 0;

  function atualizarStatus() {
    const textos = { pensando: "Processando", falando: "Falando" };
    statusTexto.textContent = textos[estadoAtual]
      || (microfoneMudo ? "Microfone desligado" : null)
      || (nivelAtual > 0 ? "Ouvindo sua voz" : "Aguardando sua voz");
  }
  function definirEstado(estado) {
    estadoAtual = estado;
    window.Esfera.definirEstado(estado);
    document.body.className = estado;
    document.body.classList.toggle("voz", nivelAtual > 0);
    atualizarStatus();
  }
  function definirNivel(nivel) {
    nivelAtual = nivel;
    window.Esfera.definirVolume(nivel);
    document.documentElement.style.setProperty("--nivel", nivel);
    document.body.classList.toggle("voz", nivel > 0);
    atualizarStatus();
    iniciarOndas();
  }

  // Ondas: a altura acompanha os decibéis da voz captada pelo microfone
  const ondas = document.getElementById("ondas");
  const pincel = ondas.getContext("2d");
  const CAMADAS = [
    { ciclos: 2.0, velocidade: 4.5, altura: 1.0, opacidade: 1, espessura: 2.5 },
    { ciclos: 3.1, velocidade: -3.2, altura: 0.68, opacidade: 0.55, espessura: 1.8 },
    { ciclos: 4.4, velocidade: 6.1, altura: 0.42, opacidade: 0.3, espessura: 1.4 },
  ];
  let amplitude = 0;
  let fase = 0;
  let ultimoQuadro = 0;
  let ondasRodando = false;

  function desenharOndas(agora) {
    const dt = Math.min((agora - ultimoQuadro) / 1000, 0.05);
    ultimoQuadro = agora;
    const alvo = estadoAtual === "ouvindo" ? nivelAtual : 0;
    amplitude += (alvo - amplitude) * Math.min(1, dt * 14);
    fase += dt;

    const escala = window.devicePixelRatio || 1;
    const largura = ondas.clientWidth;
    const altura = ondas.clientHeight;
    if (ondas.width !== Math.round(largura * escala)) {
      ondas.width = Math.round(largura * escala);
      ondas.height = Math.round(altura * escala);
    }
    pincel.setTransform(escala, 0, 0, escala, 0, 0);
    pincel.clearRect(0, 0, largura, altura);
    pincel.strokeStyle = getComputedStyle(document.body).getPropertyValue("--brilho");
    pincel.lineCap = "round";

    const margem = largura * 0.08;
    const util = largura - margem * 2;
    for (const c of CAMADAS) {
      pincel.globalAlpha = c.opacidade;
      pincel.lineWidth = c.espessura;
      pincel.beginPath();
      for (let x = 0; x <= util; x += 3) {
        const p = x / util;
        const envelope = Math.sin(Math.PI * p) ** 2; // as pontas ficam presas ao centro
        const y = altura / 2 + Math.sin(p * c.ciclos * 2 * Math.PI + fase * c.velocidade)
          * envelope * amplitude * c.altura * (altura / 2 - 4);
        if (x === 0) pincel.moveTo(margem + x, y);
        else pincel.lineTo(margem + x, y);
      }
      pincel.stroke();
    }

    // Em silêncio a linha fica parada e o desenho para, para não gastar processamento à toa
    if (alvo > 0 || amplitude > 0.004) {
      requestAnimationFrame(desenharOndas);
    } else {
      amplitude = 0;
      ondasRodando = false;
    }
  }
  function iniciarOndas() {
    if (ondasRodando) return;
    ondasRodando = true;
    ultimoQuadro = performance.now();
    requestAnimationFrame(desenharOndas);
  }
  iniciarOndas();
  // O que a pessoa disse; uma pergunta nova apaga a resposta anterior
  function definirLegenda(texto) {
    animacaoTexto = null;
    document.getElementById("fala-pessoa").textContent = texto;
    document.getElementById("fala-assistente").replaceChildren();
  }
  // A resposta do assistente aparece palavra por palavra, acompanhando a voz (como num chat de IA).
  // Cada trecho de áudio chega com o texto e a duração; as palavras se distribuem por essa duração,
  // cada uma com um tempo proporcional ao tamanho.
  const FRACAO_DA_DURACAO = 0.92;  // termina um pouco antes do fim do áudio, que costuma ter um respiro
  let animacaoTexto = null;

  function comecarResposta() {
    animacaoTexto = null;
    const quem = document.createElement("span");
    quem.className = "quem";
    quem.textContent = (document.title || "").toUpperCase();
    const fala = document.createElement("span");
    fala.id = "fala-texto";
    document.getElementById("fala-assistente").replaceChildren(quem, fala);
  }
  function escrever(palavra) {
    const fala = document.getElementById("fala-texto");
    fala.textContent += (fala.textContent ? " " : "") + palavra;
    legenda.scrollTop = legenda.scrollHeight;
  }
  function completarTrecho() {  // a voz do trecho anterior já acabou: o que faltava aparece de uma vez
    if (!animacaoTexto) return;
    animacaoTexto.palavras.slice(animacaoTexto.mostradas).forEach(escrever);
    animacaoTexto = null;
  }
  function mostrarTrecho(texto, duracao) {
    if (!document.getElementById("fala-texto")) comecarResposta();
    completarTrecho();
    const palavras = texto.split(/\s+/).filter(Boolean);
    if (!duracao || duracao <= 0) { palavras.forEach(escrever); return; }
    const pesos = palavras.map(p => p.length + 1);
    const total = pesos.reduce((a, b) => a + b, 0);
    let acumulado = 0;
    const momentos = pesos.map(peso => { const m = acumulado / total; acumulado += peso; return m * duracao * 1000 * FRACAO_DA_DURACAO; });
    animacaoTexto = { palavras, momentos, mostradas: 0, inicio: performance.now() };
    requestAnimationFrame(avancarTexto);
  }
  function avancarTexto(agora) {
    const a = animacaoTexto;
    if (!a) return;
    while (a.mostradas < a.palavras.length && a.momentos[a.mostradas] <= agora - a.inicio) {
      escrever(a.palavras[a.mostradas++]);
    }
    if (a.mostradas < a.palavras.length) requestAnimationFrame(avancarTexto);
    else animacaoTexto = null;
  }
  function pararTexto() {  // a pessoa interrompeu: o texto fica onde a voz parou
    animacaoTexto = null;
  }
  const raiz = document.documentElement;
  document.body.addEventListener("click", evento => {
    // Na bolinha, um clique ativa o assistente; nos botões em volta dela, só faz o que o botão faz
    if (raiz.classList.contains("compacto") && !evento.target.closest(".icone")) window.pywebview.api.ativar();
  });

  // As peças da bolinha vão para o lugar exato do recorte da janela, calculado no Python
  const PROPRIEDADES = ["position", "left", "top", "right", "width", "height", "margin"];
  function colocar(elemento, x, y, largura, altura) {
    Object.assign(elemento.style, { position: "absolute", left: x + "px", top: y + "px", right: "auto",
                                    width: largura + "px", height: altura + "px", margin: "0" });
  }
  function soltar(elemento) {
    PROPRIEDADES.forEach(p => elemento.style.removeProperty(p));
  }
  const pecasCompactas = () => [palco, document.getElementById("nome-compacto"), ...document.querySelectorAll(".icone")];

  function aoCompactar(desenho) {
    raiz.classList.add("compacto");
    const b = desenho.bolinha, n = desenho.nome;
    colocar(palco, b.x, b.y, b.lado, b.lado);
    colocar(document.getElementById("nome-compacto"), n.x, n.y, n.largura, n.altura);
    document.querySelectorAll(".icone").forEach(botao => botao.style.display = "none");
    for (const o of desenho.botoes) {
      const botao = document.getElementById(o.id);
      colocar(botao, o.x, o.y, o.lado, o.lado);
      botao.style.removeProperty("display");
    }
    janelaVisivel = true;
    window.Esfera.limitarQuadros(30);
    window.Esfera.definirEstado("espera");
    document.body.className = "espera";  // o olho volta às cores calmas
    atualizarAnimacao();
  }
  function aoMostrar() {
    raiz.classList.remove("compacto");
    pecasCompactas().forEach(soltar);
    document.querySelectorAll(".icone").forEach(botao => botao.style.removeProperty("display"));
    window.Esfera.limitarQuadros(60);
    definirLegenda("");
    definirNivel(0);
    definirEstado("ouvindo");
    janelaVisivel = true;
    atualizarAnimacao();
    // Reinicia as animações do SVG para o olho não abrir no meio de uma piscada
    palco.querySelector("svg").setCurrentTime(0);
    palco.classList.remove("abrindo");
    void palco.offsetWidth;
    palco.classList.add("abrindo");
  }
  function aoEsconder() {
    raiz.classList.remove("compacto");
    janelaVisivel = false;
    atualizarAnimacao();
  }
  definirPersonalidade(dados.personalidade);
</script>
</body>
</html>
