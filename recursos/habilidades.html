<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Habilidades</title>
<style>
  :root {
    --fundo: #05070c;
    --painel: #0b1019;
    --campo: #0e1522;
    --borda: #1b2638;
    --texto: #dbe6ff;
    --suave: #8a97b3;
    --destaque: #35d6ff;
    --acao: #52f2a8;
    --regra: #ffb648;
    --nao: #ff8a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--fundo); color: var(--texto); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; padding: 18px 22px 30px; }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--suave); font-size: 13px; margin: 0 0 16px; }
  .teste { background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; }
  .teste h2, .grupo h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); margin: 0 0 10px; font-weight: 600; }
  .linha { display: flex; gap: 8px; }
  input, button { font: inherit; color: var(--texto); background: var(--campo); border: 1px solid var(--borda); border-radius: 7px; }
  input { flex: 1; padding: 8px 10px; }
  button { padding: 8px 14px; cursor: pointer; background: #12304a; border-color: #1f5a85; }
  button:disabled { opacity: .5; cursor: default; }
  :is(input, button):focus-visible { outline: 2px solid var(--destaque); outline-offset: 1px; }
  #resultado { margin-top: 12px; font-size: 13.5px; }
  #resultado dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; }
  #resultado dt { color: var(--suave); }
  #resultado dd { margin: 0; }
  .nota { color: var(--suave); font-size: 12.5px; margin-top: 6px; }
  .erro { color: var(--nao); }
  .grupo { margin-bottom: 22px; }
  .grupo .desc { color: var(--suave); font-size: 13px; margin: -6px 0 10px; }
  .cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  .cartao { background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 14px 16px; }
  .cartao h3 { margin: 0; font-size: 15.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .codigo { color: var(--suave); font: 12px Consolas, monospace; }
  .selo { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid; }
  .selo.acao { color: var(--acao); border-color: #1b6b4c; }
  .selo.fala { color: var(--suave); border-color: var(--borda); }
  .selo.assistente { color: var(--destaque); border-color: #1f5a85; }
  .cartao p { margin: 8px 0; color: #c3cde6; }
  .cartao h4 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--suave); }
  .cartao ul { margin: 0; padding-left: 18px; }
  .cartao li { margin: 2px 0; }
  .alvo { color: var(--suave); font-size: 12.5px; }
  .regras li::marker { color: var(--regra); }
  .nao li::marker { color: var(--nao); }
  .vira { color: var(--nao); font-size: 12.5px; }
</style>
</head>
<body>
  <h1>Habilidades</h1>
  <p class="sub" id="resumo"></p>

  <div class="teste">
    <h2>Testar uma frase</h2>
    <div class="linha">
      <input id="frase" placeholder="Ex.: abre o chrome e pesquisa receita de bolo" aria-label="Frase para testar">
      <button id="testar" type="button">Testar</button>
    </div>
    <p class="nota">Mostra qual habilidade seria escolhida e por quê. Não executa nada.
      Uma frase com várias tarefas é testada inteira (no uso real, ela é dividida antes).</p>
    <div id="resultado" aria-live="polite"></div>
  </div>

  <div id="grupos"></div>

<script>
  const $ = id => document.getElementById(id);
  const api = () => window.pywebview.api;

  function el(tag, classe, texto) {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto !== undefined) e.textContent = texto;  // sempre texto: nada vira HTML
    return e;
  }
  function lista(itens, classe, montar) {
    const ul = el("ul", classe);
    for (const item of itens) { const li = el("li"); montar(li, item); ul.append(li); }
    return ul;
  }
  const camposEmTexto = campos => Object.entries(campos || {}).map(([k, v]) => `${k}: ${v}`).join(", ");

  function cartao(h) {
    const c = el("article", "cartao");
    const titulo = el("h3", "", h.titulo);
    const selos = { computador: ["acao", "mexe no computador"], assistente: ["assistente", "no próprio assistente"],
                    fala: ["fala", "só fala"] };
    const [classe, rotulo] = selos[h.age];
    titulo.append(el("span", "codigo", h.nome), el("span", `selo ${classe}`, rotulo));
    c.append(titulo, el("p", "", "Quando: " + h.descricao));
    if (h.exemplos.length) {
      c.append(el("h4", "", "Exemplos que ativam"), lista(h.exemplos, "", (li, e) => {
        li.append(`“${e.frase}”`);
        const extra = [e.alvo && `alvo: ${e.alvo}`, camposEmTexto(e.campos)].filter(Boolean).join(" · ");
        if (extra) li.append(" ", el("span", "alvo", `→ ${extra}`));
      }));
    }
    if (h.contraexemplos.length) {
      c.append(el("h4", "", "Parecem, mas não ativam"), lista(h.contraexemplos, "nao", (li, e) => {
        li.append(`“${e.frase}” `, el("span", "vira", `→ ${e.vira}`));
      }));
    }
    if (h.regras.length) {
      c.append(el("h4", "", "Regras que corrigem a IA"), lista(h.regras, "regras", (li, r) => li.append(r)));
    }
    if (h.campos.length) {
      c.append(el("h4", "", "Dados extras"), lista(h.campos, "", (li, f) => li.append(`${f.nome}: ${f.descricao}`)));
    }
    return c;
  }

  async function carregar() {
    const r = await api().listar();
    $("resumo").textContent = `${r.total} habilidades. A IA escolhe em ${r.modo}; acima de ${r.limite_uma_etapa} ` +
      "habilidades, ela passa sozinha a escolher em duas etapas.";
    $("grupos").replaceChildren(...r.grupos.map(g => {
      const s = el("section", "grupo");
      s.append(el("h2", "", `Grupo: ${g.nome}`), el("p", "desc", g.descricao));
      const cartoes = el("div", "cartoes");
      cartoes.append(...g.habilidades.map(cartao));
      s.append(cartoes);
      return s;
    }));
  }

  async function testar() {
    const botao = $("testar");
    botao.disabled = true;
    $("resultado").replaceChildren(el("span", "nota", "Perguntando à IA…"));
    const r = await api().testar($("frase").value);
    botao.disabled = false;
    if (r.erro) { $("resultado").replaceChildren(el("span", "erro", r.erro)); return; }
    const dl = el("dl");
    const linha = (rotulo, valor) => { if (valor) dl.append(el("dt", "", rotulo), el("dd", "", valor)); };
    linha("Habilidade", r.titulo);
    linha("Alvo", r.alvo);
    linha("Dados", camposEmTexto(r.campos));
    linha("Grupo escolhido", r.grupo);
    if (r.motivo_regra) {
      linha("A IA tinha escolhido", r.ia_escolheu);
      linha("Uma regra mudou porque", r.motivo_regra);
    }
    linha("Tempo", `${String(r.tempo).replace(".", ",")} s`);
    $("resultado").replaceChildren(dl);
  }

  $("testar").addEventListener("click", testar);
  $("frase").addEventListener("keydown", e => { if (e.key === "Enter") testar(); });
  window.addEventListener("pywebviewready", carregar);
</script>
</body>
</html>
