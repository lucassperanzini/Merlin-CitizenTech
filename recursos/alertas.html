<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Alertas</title>
<!--MAPA-->
<style>
  :root {
    --fundo: #05070c; --painel: #0b1019; --campo: #0e1522; --borda: #1b2638; --texto: #dbe6ff;
    --suave: #8a97b3; --destaque: #35d6ff; --nao: #ff8a7a;
    --baixo: #3ec46d; --medio: #ffd23f; --alto: #ff8a3d; --critico: #ff4d4d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; padding: 18px 22px 16px; background: var(--fundo); color: var(--texto);
         font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  [hidden] { display: none !important; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; white-space: nowrap; }
  p { margin: 0 0 10px; color: var(--suave); font-size: 13px; }
  .topo { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .quando { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--painel);
            border: 1px solid var(--borda); font-size: 12px; color: var(--suave); white-space: nowrap; }
  .quando::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--baixo); }
  .quando.antiga::before { background: var(--medio); }
  button { font: inherit; color: var(--texto); padding: 7px 14px; border-radius: 7px; border: 1px solid var(--borda); background: var(--campo); cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--destaque); }
  button:disabled { opacity: .6; cursor: progress; }
  button.principal { background: var(--destaque); border-color: var(--destaque); color: #05070c; font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--destaque); outline-offset: 1px; }
  /* Busca automática e modo teste: o administrador configura; o operador só vê quando roda */
  .automatico { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-left: auto; padding: 5px 10px;
                background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; font-size: 13px; color: var(--suave); }
  .automatico .titulo { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .automatico select { font: inherit; color: var(--texto); padding: 5px 8px; border-radius: 7px; border: 1px solid var(--borda); background: var(--campo); cursor: pointer; }
  .automatico select:hover { border-color: var(--destaque); }
  .automatico .proxima { color: var(--texto); font-variant-numeric: tabular-nums; }
  .automatico .separa { width: 1px; height: 22px; background: var(--borda); }
  .automatico .chave { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; color: var(--texto); }
  .automatico .chave input { accent-color: var(--medio); width: 15px; height: 15px; margin: 0; cursor: pointer; }
  .automatico .chave small { color: var(--suave); }
  .aviso-teste { display: flex; align-items: center; gap: 10px; margin: 8px 0 0; padding: 7px 12px; border-radius: 10px; font-size: 13px;
                 border: 1px solid color-mix(in srgb, var(--medio) 50%, var(--borda)); color: var(--texto);
                 background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--medio) 12%, var(--painel)) 0 10px, var(--painel) 10px 20px); }
  .aviso-teste b { color: var(--medio); letter-spacing: .08em; white-space: nowrap; }
  .quando.teste::before { background: var(--medio); }
  #mensagem { flex: none; margin-top: 6px; font-size: 13px; color: var(--suave); overflow-wrap: anywhere; }
  #mensagem:empty { display: none; }
  #mensagem.erro { color: var(--nao); }
  .numeros { flex: none; display: grid; grid-template-columns: minmax(240px, 2fr) repeat(4, minmax(110px, 1fr)); gap: 8px; margin: 10px 0 8px; }
  /* Cartão do maior incêndio: um clique leva o mapa até ele */
  .numero.maior { cursor: pointer; }
  .numero.maior:hover { border-color: var(--destaque); }
  .numero.maior b small { display: inline; font-size: 14px; color: var(--suave); }
  /* Rótulo das maiores manchas de incêndio, no mapa */
  .rotulo-mancha { padding: 2px 7px; border-radius: 6px; background: rgba(5, 7, 12, .82); border: 1px solid var(--cor);
                   color: #fff; font: 600 12px/1.25 "Segoe UI", sans-serif; white-space: nowrap; font-variant-numeric: tabular-nums;
                   transform: translate(-50%, -135%); width: max-content; cursor: pointer; }
  .rotulo-mancha small { display: block; font-weight: 400; font-size: 11px; color: var(--suave); }
  .popup .aviso { margin: 0 0 6px; color: var(--suave); font-size: 11.5px; max-width: 230px; }
  @media (max-width: 760px) { .numeros { grid-template-columns: repeat(2, 1fr); } .numeros .principal { grid-column: 1 / -1; } }
  .numero { padding: 10px 14px; background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; min-width: 0; }
  .numero .rotulo { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
  .numero b { display: block; margin: 2px 0; font-size: 26px; line-height: 1.15; font-weight: 600; font-variant-numeric: tabular-nums; }
  .numero small { display: block; font-size: 12px; color: var(--suave); }
  .numero.alerta.tem { border-color: color-mix(in srgb, var(--critico) 55%, var(--borda)); background: color-mix(in srgb, var(--critico) 10%, var(--painel)); }
  .numero.alerta.tem b { color: var(--critico); }
  .numero.novos.tem b { color: var(--destaque); }
  .faixa { display: flex; height: 8px; margin: 8px 0 6px; border-radius: 4px; overflow: hidden; background: var(--campo); }
  .faixa span { min-width: 3px; }
  .faixa-legenda { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--suave); font-variant-numeric: tabular-nums; }
  .faixa-legenda span { display: inline-flex; align-items: center; gap: 5px; }
  .faixa-legenda i, .chip i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .filtros { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .filtros .titulo { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); margin-right: 2px; }
  .filtros .separa { width: 1px; height: 22px; background: var(--borda); margin: 0 6px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="false"] { color: var(--suave); background: transparent; }
  .chip[aria-pressed="false"] i { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--cor); }
  .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--cor) 16%, var(--campo)); border-color: color-mix(in srgb, var(--cor) 60%, var(--borda)); }
  .chip .qtd { color: var(--suave); }
  .chave { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
  .chave input { accent-color: var(--destaque); width: 15px; height: 15px; margin: 0; cursor: pointer; }
  /* O mapa e, ao lado, a lista dos incêndios do mais grave ao menos grave */
  .conteudo { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 290px; gap: 8px; }
  .conteudo:not(:has(.lista:not([hidden]))) { grid-template-columns: 1fr; }
  #mapa { min-height: 320px; border-radius: 10px; background: #0a0f18; }
  .lista { display: flex; flex-direction: column; min-height: 0; background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; }
  .lista-topo { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--borda); }
  .lista-topo b { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); font-weight: 600; }
  .lista-topo span { font-size: 12px; color: var(--suave); font-variant-numeric: tabular-nums; }
  .lista ol { flex: 1; margin: 0; padding: 4px; list-style: none; overflow-y: auto; }
  .lista li button { display: grid; grid-template-columns: 4px 1fr auto; gap: 2px 10px; width: 100%; padding: 7px 8px; text-align: left;
                     background: transparent; border: 1px solid transparent; border-radius: 7px; }
  .lista li button:hover { background: var(--campo); border-color: var(--borda); }
  .lista li button.ativo { background: color-mix(in srgb, var(--cor) 12%, var(--campo)); border-color: color-mix(in srgb, var(--cor) 55%, var(--borda)); }
  .lista li .barra { grid-row: 1 / 3; border-radius: 2px; background: var(--cor); }
  .lista li .area { font-weight: 600; font-variant-numeric: tabular-nums; }
  .lista li .nivel { justify-self: end; font-size: 12px; color: var(--cor); font-weight: 600; }
  .lista li .onde { grid-column: 2 / 4; font-size: 12px; color: var(--suave); font-variant-numeric: tabular-nums; }
  .lista li .onde .novo { color: var(--destaque); font-weight: 600; }
  .lista-fim { padding: 6px 12px 8px; font-size: 12px; color: var(--suave); border-top: 1px solid var(--borda); }
  .lista-fim:empty { display: none; }
  .lista .vazio { padding: 14px 10px; font-size: 13px; color: var(--suave); }
  @media (max-width: 900px) { .conteudo { grid-template-columns: 1fr; grid-template-rows: 1fr 190px; } }
  .nota { flex: none; margin-top: 6px; font-size: 12px; color: var(--suave); overflow-wrap: anywhere; }
  .nota:empty { display: none; }
  /* Leaflet no tema escuro da Central */
  .leaflet-container { font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  /* O OpenStreetMap é claro: escurecido só no fundo, sem mexer nas cores dos focos e do contorno */
  .fundo-escurecido { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.6); }
  .leaflet-control-layers { background: rgba(11, 16, 25, .92); color: var(--texto); border: 1px solid var(--borda) !important; border-radius: 8px; }
  .leaflet-control-layers-expanded { padding: 6px 10px; }
  .leaflet-control-layers label { cursor: pointer; }
  .leaflet-control-attribution { background: rgba(5, 7, 12, .75) !important; color: var(--suave); }
  .leaflet-control-attribution a { color: var(--destaque); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--painel); color: var(--texto); border: 1px solid var(--borda); }
  .leaflet-bar a { background: var(--campo); color: var(--texto); border-color: var(--borda); }
  .legenda { padding: 8px 10px; background: rgba(11, 16, 25, .92); border: 1px solid var(--borda); border-radius: 8px; color: var(--texto); }
  .legenda b { display: block; margin-bottom: 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
  .legenda label { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer; font-variant-numeric: tabular-nums; }
  .legenda label.desligado { color: var(--suave); }
  .legenda i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .5); }
  .legenda .qtd { margin-left: auto; padding-left: 10px; color: var(--suave); }
  .popup b { font-size: 14px; }
  .popup dl { display: grid; grid-template-columns: auto auto; gap: 1px 10px; margin: 6px 0 8px; }
  .popup dt { color: var(--suave); }
  .popup dd { margin: 0; font-variant-numeric: tabular-nums; }
  .popup .novo { color: var(--destaque); font-weight: 600; }
  .popup .filtrado { margin-top: 4px; color: var(--medio); font-size: 12px; }
  .popup button { padding: 3px 10px; font-size: 12px; }
</style>
</head>
<body>
  <div class="topo">
    <h1 title="Focos de calor da NASA (FIRMS), trazidos pelo robô FIRMS Monitor e coloridos pelo risco">Alertas · focos de calor</h1>
    <span class="quando" id="quando" hidden></span>
    <div class="automatico" id="automatico" hidden></div>
  </div>
  <div id="mensagem" role="status" aria-live="polite"></div>
  <div class="aviso-teste" id="aviso-teste" role="note" hidden>
    <b>MODO TESTE</b>
    <span>Antes de cada busca, o CSV do robô e a última consulta são apagados: todos os focos voltam como novos,
      e os do nível de alerta disparam o aviso do Merlin a cada vez.</span>
  </div>
  <div class="numeros" id="numeros" hidden></div>
  <div class="filtros" id="filtros" role="group" aria-label="Filtros do mapa" hidden></div>
  <div class="conteudo">
    <div id="mapa" role="region" aria-label="Mapa dos focos de calor"></div>
    <aside class="lista" id="lista" aria-label="Incêndios, do mais grave ao menos grave" hidden>
      <div class="lista-topo"><b>Incêndios</b><span id="lista-qtd"></span></div>
      <ol id="lista-itens"></ol>
      <div class="lista-fim" id="lista-fim"></div>
    </aside>
  </div>
  <div class="nota" id="nota"></div>

<script>
  const $ = id => document.getElementById(id);
  const api = () => window.pywebview.api;
  const elemento = (tag, propriedades = {}, ...filhos) => { const e = Object.assign(document.createElement(tag), propriedades); e.append(...filhos); return e; };
  const CORES = { 1: "#3ec46d", 2: "#ffd23f", 3: "#ff8a3d", 4: "#ff4d4d" };
  const RAIO = { 1: 3, 2: 4, 3: 6, 4: 8 };
  // Fundos de mapa pela internet. Com a chave MAPTILER_KEY no .env: satélite, escuro e ruas do MapTiler.
  // Sem ela, ou se ela falhar: o OpenStreetMap, escurecido. Sem internet: só o contorno dos estados.
  // (A CARTO passou a exigir chave: sem ela, devolve imagens com "API KEY REQUIRED", e não um erro.)
  const CREDITO_OSM = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  const CREDITO_MAPTILER = '&copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a> ' + CREDITO_OSM;
  const MAPTILER = { "Satélite": "satellite/256/{z}/{x}/{y}.jpg", "Escuro": "streets-v2-dark/256/{z}/{x}/{y}.png", "Ruas": "streets-v2/256/{z}/{x}/{y}.png" };

  function avisar(texto = "", erro = false) {
    $("mensagem").textContent = texto;
    $("mensagem").classList.toggle("erro", erro);
  }

  // --- O mapa, que aparece já ao abrir a aba, com o contorno dos estados
  const mapa = L.map("mapa", { preferCanvas: true, zoomSnap: 0.5, worldCopyJump: true });
  const contorno = L.geoJSON(window.CONTORNO_BRASIL, { style: { color: "#35d6ff", weight: 1, opacity: .55, fill: true, fillColor: "#0e1522", fillOpacity: .12 }, interactive: false }).addTo(mapa);
  // A aba começa escondida (tamanho zero): só dá para enquadrar o Brasil quando ela aparecer de verdade
  let enquadrado = false;
  function enquadrar() {
    const tamanho = mapa.getSize();
    if (enquadrado || !tamanho.x || !tamanho.y) return;
    mapa.fitBounds(contorno.getBounds(), { padding: [10, 10] });
    enquadrado = true;
  }
  mapa.setView([-14, -52], 4);
  window.estadoDoFundo = "carregando";

  let fundoAtual = null, seletorDeFundo = null;

  function avisarFundo(texto) { $("nota").dataset.fundo = texto; atualizarNota(); }

  // Uma camada de fundo que avisa quando não consegue carregar nada (sem internet, chave recusada...)
  function camadaDeFundo(url, credito, nome, aoFalhar, classe = "") {
    const camada = L.tileLayer(url, { attribution: credito, maxZoom: 19, className: classe });
    let carregados = 0, falhas = 0;
    camada.on("tileload", () => { carregados++; window.estadoDoFundo = `ok:${nome}`; });
    camada.on("tileerror", () => {
      falhas++;
      if (!carregados && falhas >= 4) aoFalhar();
    });
    return camada;
  }

  function trocarFundo(camada) {
    if (fundoAtual && fundoAtual !== camada) mapa.removeLayer(fundoAtual);
    fundoAtual = camada;
    if (camada) { camada.addTo(mapa); camada.bringToBack(); }
  }

  function usarOpenStreetMap(motivo = "") {
    if (seletorDeFundo) { mapa.removeControl(seletorDeFundo); seletorDeFundo = null; }
    const semFundo = () => { trocarFundo(null); window.estadoDoFundo = "sem fundo"; avisarFundo("Sem internet para o fundo do mapa: aparecem só os estados."); };
    trocarFundo(camadaDeFundo("https://tile.openstreetmap.org/{z}/{x}/{y}.png", CREDITO_OSM, "OpenStreetMap", semFundo, "fundo-escurecido"));
    avisarFundo(motivo);
  }

  function usarMapTiler(chave, salvo) {
    const falhou = () => usarOpenStreetMap("A chave do MapTiler não funcionou (confira MAPTILER_KEY no .env): usando o OpenStreetMap.");
    const fundos = Object.fromEntries(Object.entries(MAPTILER).map(([nome, caminho]) =>
      [nome, camadaDeFundo(`https://api.maptiler.com/maps/${caminho}?key=${encodeURIComponent(chave)}`, CREDITO_MAPTILER, nome, falhou)]));
    trocarFundo(fundos[salvo in fundos ? salvo : "Satélite"]);
    seletorDeFundo = L.control.layers(fundos, null, { position: "topright", collapsed: false }).addTo(mapa);
    avisarFundo("");
  }
  mapa.on("baselayerchange", e => {
    fundoAtual = e.layer;
    e.layer.bringToBack();
    api().escolher_fundo(e.name).catch(() => {});
  });

  // A chave vem do .env pelo Python, já conferida; até a resposta chegar, o mapa mostra só os estados
  async function escolherFundo() {
    let r = {};
    try { r = await api().fundos(); } catch (e) {}
    r.maptiler ? usarMapTiler(r.maptiler, r.escolhido) : usarOpenStreetMap(r.aviso || "");
  }

  // --- Focos e legenda (com filtro por nível)
  const camadas = { 1: L.layerGroup(), 2: L.layerGroup(), 3: L.layerGroup(), 4: L.layerGroup() };
  [3, 4].forEach(g => camadas[g].addTo(mapa));  // Baixo e Médio começam escondidos
  let sóNovos = false, comFiltro = true, ultimo = null;
  // Os focos que aparecem agora: com filtro, só os ativos; sem filtro, também os que os filtros do robô tiraram
  const visiveis = r => r.focos.filter(f => (comFiltro ? !f.filtrado : true) && (!sóNovos || f.novo));

  function detalhe(f) {
    const linhas = [["FRP", `${f.frp.toFixed(1)} MW`], ["Detectado", `${f.quando} UTC`], ["Latitude", f.latitude.toFixed(5)],
                    ["Longitude", f.longitude.toFixed(5)], ["Satélite", f.satelite], ["Confiança", f.confianca]];
    const lista = elemento("dl", {}, ...linhas.flatMap(([a, b]) => [elemento("dt", { textContent: a }), elemento("dd", { textContent: b })]));
    const botao = elemento("button", { type: "button", textContent: "Abrir no Google Maps", onclick: async () => {
      const r = await api().abrir_mapa(f.latitude, f.longitude);
      if (r.erro) avisar(r.erro, true);
    } });
    return elemento("div", { className: "popup" }, elemento("b", { textContent: `Risco ${f.nivel}` }),
      f.novo ? elemento("span", { className: "novo", textContent: " · novo" }) : "",
      f.filtrado ? elemento("div", { className: "filtrado", textContent: `Tirado pelo filtro do robô: ${f.filtrado}` }) : "", lista, botao);
  }

  function desenharFocos(r) {
    Object.values(camadas).forEach(c => c.clearLayers());
    // Os mais fracos primeiro, e os descartados antes dos ativos: os críticos ativos ficam por cima
    const lista = visiveis(r).reverse().sort((a, b) => !!b.filtrado - !!a.filtrado);
    lista.forEach(f => {
      // Descartado pelo filtro: só o contorno, tracejado, para não se confundir com um foco ativo
      const estilo = f.filtrado
        ? { radius: RAIO[f.grau], color: CORES[f.grau], weight: 1.5, dashArray: "3 3", fillColor: CORES[f.grau], fillOpacity: .12 }
        : { radius: RAIO[f.grau], color: "#05070c", weight: 1, fillColor: CORES[f.grau], fillOpacity: .9 };
      L.circleMarker([f.latitude, f.longitude], estilo)
        .bindPopup(() => detalhe(f), { autoPanPadding: [20, 20] }).addTo(camadas[f.grau]);
    });
  }

  // --- Manchas de incêndio (merlin/alertas/manchas.py): os pixels do satélite de cada incêndio, no tamanho real,
  // embaixo dos pontos. Uma mancha aparece se o nível mais grave dela estiver ligado na legenda.
  mapa.createPane("manchas").style.zIndex = 390;  // abaixo dos pontos (400)
  const pincelManchas = L.canvas({ pane: "manchas" });
  const camadaManchas = L.layerGroup().addTo(mapa);
  const camadaRotulos = L.layerGroup().addTo(mapa);
  let comManchas = true;
  // Só as maiores ganham rótulo fixo (as outras mostram os números ao passar o mouse): poucas com o Brasil
  // inteiro na tela, mais ao aproximar, e nunca um rótulo em cima do outro
  const rotulosNoZoom = () => mapa.getZoom() < 6 ? 3 : mapa.getZoom() < 8 ? 6 : 12;
  const DISTANCIA_ROTULOS = 70;  // pixels da tela entre um rótulo e outro
  const km2 = a => `${a < 1 ? a.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) : a.toLocaleString("pt-BR", { maximumFractionDigits: 1 })} km²`;
  const km = d => `${d.toLocaleString("pt-BR", { maximumFractionDigits: 1 })} km`;

  function pixel(f) {  // o retângulo do pixel no chão: scan de largura e track de altura, em km
    const dLat = f.track / 2 / 110.57, dLon = f.scan / 2 / (111.32 * Math.cos(f.latitude * Math.PI / 180));
    return [[f.latitude - dLat, f.longitude - dLon], [f.latitude + dLat, f.longitude + dLon]];
  }
  function detalheMancha(m) {
    const linhas = [["Área em chamas", `~${km2(m.area_km2)}`], ["Extensão", km(m.extensao_km)],
                    // os focos são os pixels do satélite que formam o incêndio: só aparecem aqui, no detalhe
                    ["Focos", `${m.focos.toLocaleString("pt-BR")}${m.novos ? ` (${m.novos} novos)` : ""}`],
                    ["FRP somado", `${m.frp.toLocaleString("pt-BR")} MW`]];
    const lista = elemento("dl", {}, ...linhas.flatMap(([a, b]) => [elemento("dt", { textContent: a }), elemento("dd", { textContent: b })]));
    const botao = elemento("button", { type: "button", textContent: "Aproximar", onclick: () => irParaMancha(m) });
    return elemento("div", { className: "popup" }, elemento("b", { textContent: `Incêndio · risco ${m.nivel}` }), lista,
      elemento("p", { className: "aviso", textContent: "Cada foco é um pixel de ~0,4 km em que o satélite viu fogo. Estimativa do fogo ativo, não da área queimada." }), botao);
  }
  // --- A lista ao lado do mapa: os incêndios dos níveis ligados na legenda, do mais grave ao menos grave e,
  // no mesmo risco, do maior ao menor. Um clique leva o mapa até ele.
  const MAX_NA_LISTA = 100;
  let manchaEscolhida = null;
  const grau = (v, pos, neg) => `${Math.abs(v).toLocaleString("pt-BR", { maximumFractionDigits: 2 })}° ${v < 0 ? neg : pos}`;
  function desenharLista(r) {
    const caixa = $("lista");
    caixa.hidden = !r || !Array.isArray(r.manchas);
    if (caixa.hidden) return;
    const escolhidas = r.manchas.filter(m => mapa.hasLayer(camadas[m.grau]) && (!sóNovos || m.novos))
      .sort((a, b) => b.grau - a.grau || b.area_km2 - a.area_km2);
    $("lista-qtd").textContent = escolhidas.length.toLocaleString("pt-BR");
    const itens = escolhidas.slice(0, MAX_NA_LISTA).map(m => {
      const botao = elemento("button", { type: "button", className: m.id === manchaEscolhida ? "ativo" : "",
          title: `Incêndio de risco ${m.nivel}: ~${km2(m.area_km2)} em chamas, ${km(m.extensao_km)} de extensão. Clique para ver no mapa.`,
          onclick: () => irParaMancha(m) },
        elemento("span", { className: "barra" }),
        elemento("span", { className: "area", textContent: `~${km2(m.area_km2)} · ${km(m.extensao_km)}` }),
        elemento("span", { className: "nivel", textContent: m.nivel }),
        elemento("span", { className: "onde" }, `${grau(m.latitude, "N", "S")} · ${grau(m.longitude, "L", "O")}`,
          m.novos ? elemento("span", { className: "novo", textContent: " · novo" }) : ""));
      return elemento("li", { style: `--cor:${CORES[m.grau]}` }, botao);
    });
    $("lista-itens").replaceChildren(...(itens.length ? itens
      : [elemento("li", { className: "vazio", textContent: "Nenhum incêndio nos níveis ligados na legenda." })]));
    const resto = escolhidas.length - itens.length;
    const desligados = [2, 1].filter(g => !mapa.hasLayer(camadas[g])).map(g => NOME[g]);
    $("lista-fim").textContent = resto > 0 ? `E mais ${resto.toLocaleString("pt-BR")} menores, no mapa.`
      : desligados.length ? `${desligados.join(" e ")}: ligue na legenda para listar.` : "";
  }
  function irParaMancha(m) {
    manchaEscolhida = m.id;
    // O nível dela pode estar desligado na legenda (Baixo e Médio começam assim): liga, para ela aparecer
    if (!mapa.hasLayer(camadas[m.grau])) { camadas[m.grau].addTo(mapa); desenharLegenda(ultimo); desenharFocos(ultimo); }
    if (!comManchas) { comManchas = true; desenharFiltros(ultimo); }
    desenharManchas(ultimo);
    const pixels = (porMancha[m.id] || []).flatMap(pixel);
    if (pixels.length) mapa.flyToBounds(L.latLngBounds(pixels).pad(0.6), { maxZoom: 13, duration: 0.8 });
  }
  let porMancha = {};
  function desenharManchas(r) {
    camadaManchas.clearLayers();
    camadaRotulos.clearLayers();
    porMancha = {};
    if (!r || !Array.isArray(r.manchas)) return;  // consulta guardada antes das manchas
    r.focos.forEach(f => { if (f.mancha != null && f.scan) (porMancha[f.mancha] ||= []).push(f); });
    desenharLista(r);
    if (!comManchas) return;
    for (const m of r.manchas) {  // já vêm da maior para a menor
      if (!mapa.hasLayer(camadas[m.grau]) || !porMancha[m.id]) continue;
      const cor = CORES[m.grau], resumo = `Incêndio · ~${km2(m.area_km2)} · ${km(m.extensao_km)} de extensão`;
      for (const f of porMancha[m.id]) {
        L.rectangle(pixel(f), { renderer: pincelManchas, color: cor, weight: .6, opacity: .7, fillColor: cor, fillOpacity: .3 })
          .bindTooltip(resumo, { sticky: true }).bindPopup(() => detalheMancha(m)).addTo(camadaManchas);
      }
    }
    desenharRotulos(r);
  }
  function desenharRotulos(r) {
    camadaRotulos.clearLayers();
    if (!comManchas || !r || !Array.isArray(r.manchas)) return;
    const limite = rotulosNoZoom(), postos = [], area = mapa.getBounds();
    for (const m of r.manchas) {
      if (postos.length >= limite) break;
      if (m.focos < 2 || !mapa.hasLayer(camadas[m.grau]) || !area.contains([m.latitude, m.longitude])) continue;
      const ponto = mapa.latLngToContainerPoint([m.latitude, m.longitude]);
      // um maior já está ali perto (o rótulo é largo: precisa de mais folga para os lados que para cima)
      if (postos.some(p => Math.abs(p.x - ponto.x) < DISTANCIA_ROTULOS * 1.9 && Math.abs(p.y - ponto.y) < DISTANCIA_ROTULOS * .7)) continue;
      postos.push(ponto);
      const html = `<div class="rotulo-mancha" style="--cor:${CORES[m.grau]}">~${km2(m.area_km2)}<small>${km(m.extensao_km)} de extensão</small></div>`;
      L.marker([m.latitude, m.longitude], { icon: L.divIcon({ className: "", html, iconSize: null }), keyboard: false })
        .bindPopup(() => detalheMancha(m)).addTo(camadaRotulos);
    }
  }
  mapa.on("zoomend moveend", () => desenharRotulos(ultimo));

  const GRAU = { "Crítico": 4, "Alto": 3, "Médio": 2, "Baixo": 1 };
  const NOME = { 4: "Crítico", 3: "Alto", 2: "Médio", 1: "Baixo" };
  const redesenhar = () => { desenharFocos(ultimo); desenharManchas(ultimo); desenharFiltros(ultimo); };

  // A legenda de risco, dentro do mapa: cada nível liga e desliga a sua camada. Aparece já ao abrir a aba.
  const legenda = L.control({ position: "bottomright" });
  legenda.onAdd = () => {
    const caixa = elemento("div", { className: "legenda", id: "legenda" });
    L.DomEvent.disableClickPropagation(caixa);
    L.DomEvent.disableScrollPropagation(caixa);
    return caixa;
  };
  legenda.addTo(mapa);
  function desenharLegenda(r) {
    // As quantidades contam o que está no mapa agora (com ou sem descartados, só novos ou não)
    const conta = {};
    if (r) visiveis(r).forEach(f => { conta[f.grau] = (conta[f.grau] || 0) + 1; });
    $("legenda").replaceChildren(elemento("b", { textContent: "Risco (FRP)" }), ...[4, 3, 2, 1].map(g => {
      const ligado = mapa.hasLayer(camadas[g]);
      const marcar = elemento("input", { type: "checkbox", checked: ligado,
        onchange: e => { e.target.checked ? camadas[g].addTo(mapa) : mapa.removeLayer(camadas[g]); desenharLegenda(ultimo); desenharManchas(ultimo); } });
      return elemento("label", { className: ligado ? "" : "desligado", title: ligado ? `Esconder os focos ${NOME[g]}` : `Mostrar os focos ${NOME[g]}` },
        marcar, elemento("i", { style: `background:${CORES[g]}` }), NOME[g], elemento("span", { className: "qtd", textContent: r ? conta[g] || 0 : "–" }));
    }));
  }
  desenharLegenda(null);

  // A barra acima do mapa: as chaves de "novos" e "descartados"
  function desenharFiltros(r) {
    desenharLegenda(r);
    const chave = (texto, marcado, mudar, dica = "") => elemento("label", { className: "chave", title: dica },
      elemento("input", { type: "checkbox", checked: marcado, onchange: e => { mudar(e.target.checked); redesenhar(); } }), texto);
    const extras = [chave("Só os novos", sóNovos, v => { sóNovos = v; })];
    if (Array.isArray(r.manchas)) extras.unshift(chave("Área dos incêndios", comManchas, v => { comManchas = v; },
      "Os pixels do satélite no tamanho real, com a área em chamas e a extensão de cada incêndio estimadas."));
    if (r.descartados) extras.push(chave(`Mostrar descartados pelo robô (${r.descartados})`, !comFiltro, v => { comFiltro = !v; },
      "Focos que os filtros do robô tiram (baixa confiança, FRP baixo, fora do território). Aparecem com contorno tracejado."));
    $("filtros").replaceChildren(elemento("span", { className: "titulo", textContent: "Mostrar" }), ...extras);
    $("filtros").hidden = false;
  }

  function numero(rotulo, valor, detalhe, classe = "") {
    return elemento("div", { className: `numero ${classe}` }, elemento("span", { className: "rotulo", textContent: rotulo }),
      typeof valor === "string" ? elemento("b", { innerHTML: valor }) : elemento("b", { textContent: Number(valor).toLocaleString("pt-BR") }), detalhe);
  }
  // O maior incêndio da consulta: um clique leva o mapa até ele
  function cartaoMaior(r) {
    const m = (r.manchas || [])[0];
    if (!m) return numero("Maior incêndio", "–", elemento("small", { textContent: r.manchas ? "nenhum foco ativo" : "busque de novo para medir" }));
    const cartao = numero("Maior incêndio", `~${km2(m.area_km2)}`,
      elemento("small", { textContent: `${km(m.extensao_km)} · risco ${m.nivel}` }), "maior");
    cartao.title = "Área em chamas estimada pelos pixels do satélite. Clique para ver no mapa.";
    cartao.onclick = () => irParaMancha(m);
    return cartao;
  }
  // Os ativos, divididos por risco numa faixa colorida
  function cartaoAtivos(r) {
    const niveis = r.por_nivel.map(n => ({ ...n, grau: GRAU[n.nivel] })).filter(n => n.grau);
    const faixa = elemento("div", { className: "faixa", title: niveis.map(n => `${n.nivel}: ${n.quantidade}`).join(" · ") },
      ...niveis.filter(n => n.quantidade).map(n => elemento("span", { style: `flex:${n.quantidade};background:${CORES[n.grau]}` })));
    const legenda = elemento("div", { className: "faixa-legenda" },
      ...niveis.map(n => elemento("span", {}, elemento("i", { style: `background:${CORES[n.grau]}` }), `${n.nivel} ${n.quantidade}`)));
    return numero("Focos ativos", r.ativos, elemento("div", {}, r.ativos ? faixa : "", legenda), "principal");
  }

  function atualizarNota() {
    const partes = [$("nota").dataset.consulta, $("nota").dataset.fundo].filter(Boolean);
    $("nota").textContent = partes.join(" ");
  }
  // guardada: veio do arquivo da última busca, e não de uma busca feita agora
  function mostrar(r, guardada = false) {
    ultimo = r;
    const pequeno = texto => elemento("small", { textContent: texto });
    const emAlerta = r.em_alerta ?? r.focos.filter(f => f.alerta).length;
    $("numeros").replaceChildren(
      cartaoAtivos(r),
      // Consultas guardadas antes de existir em_alerta: conta pelos focos do mapa
      numero("Em alerta", emAlerta, pequeno(`risco ${r.alerta_a_partir_de} ou mais · ${r.alertas ? `${r.alertas.toLocaleString("pt-BR")} avisados` : "nenhum novo"}`),
             `alerta ${emAlerta ? "tem" : ""}`),
      numero("Novos", r.novos, pequeno(guardada ? "naquela consulta" : "desde a consulta anterior"), `novos ${r.novos ? "tem" : ""}`),
      cartaoMaior(r),
      numero("Coletados", r.coletados, pequeno(r.descartados ? `pela NASA · ${r.descartados.toLocaleString("pt-BR")} filtrados` : "pela NASA")));
    $("numeros").hidden = false;
    const origem = guardada ? "Última consulta" : r.teste ? "Teste (começou do zero)" : r.automatica ? "Busca automática" : "Consultado";
    $("quando").textContent = `${origem}: ${r.consultado_em} · ${r.fonte} · ${r.dias * 24} h`;
    $("quando").classList.toggle("antiga", guardada);
    $("quando").classList.toggle("teste", !!r.teste);
    $("quando").title = guardada ? "Dados guardados da última busca. A próxima busca automática atualiza o mapa."
      : r.teste ? "Modo teste: o CSV e a última consulta foram apagados antes desta busca." : "";
    if (r.versao) versaoVista = Math.max(versaoVista, r.versao);
    $("quando").hidden = false;
    desenharFocos(r);
    desenharManchas(r);
    desenharFiltros(r);
    const cortados = r.ativos + r.descartados > r.focos.length ? ` No mapa, os ${r.focos.length} mais fortes (ativos primeiro).` : "";
    const motivos = r.por_motivo.length ? `Tirados pelos filtros: ${r.por_motivo.map(m => `${m.quantidade} por ${m.motivo}`).join(", ")}.` : "";
    const gravadas = r.teste ? `Modo teste: o CSV do robô (${r.csv}) foi apagado e gravado de novo só com esta busca.`
      : `Ocorrências gravadas pelo robô em ${r.csv}.`;
    const sobreManchas = Array.isArray(r.manchas) ? " Incêndios: estimativa do fogo ativo nas passagens do satélite (pixels de 0,3 a 0,8 km), não da área queimada." : "";
    // Na tela, só o que ajuda a ler o mapa; o caminho do CSV e a ressalva das manchas ficam na dica
    $("nota").dataset.consulta = `${motivos}${cortados}`.trim();
    $("nota").title = `${gravadas}${sobreManchas}`;
    atualizarNota();
    mapa.invalidateSize();
  }

  // Ao abrir a aba: a última consulta guardada volta ao mapa, sem consultar a NASA de novo
  async function carregarUltima() {
    let r = {};
    try { r = await api().ultima(); } catch (e) {}
    if (ultimo) return;  // uma busca terminou antes: ela é mais nova
    if (r && Array.isArray(r.focos)) mostrar(r, true);
    else avisar(semConsulta());
  }
  // Sem o botão de buscar, os focos só chegam pela busca automática
  function semConsulta() {
    if (automatico.intervalo) return `Nenhuma consulta ainda. A busca automática traz os focos às ${automatico.proxima}.`;
    return automatico.administrador ? "Nenhuma consulta ainda. Escolha um intervalo em Busca automática para o Merlin buscar os focos."
      : "Nenhuma consulta ainda. A busca automática está desligada: peça ao administrador para ligá-la.";
  }

  // --- Busca automática: roda no Merlin mesmo com a Central fechada; a aba aberta mostra o resultado quando chega
  let automatico = {}, versaoVista = 0;
  const NOME_INTERVALO = m => !m ? "Desligada" : m < 60 ? `A cada ${m} min` : `A cada ${m / 60} h`;

  function desenharAutomatico() {
    const a = automatico, caixa = $("automatico");
    $("aviso-teste").hidden = !a.modo_teste;
    const proxima = () => elemento("span", { className: "proxima",
      textContent: a.intervalo && a.proxima ? `próxima às ${a.proxima}` : "" });
    if (!a.administrador) {
      // O operador só fica sabendo que existe e quando roda; quem muda é o administrador
      caixa.hidden = !a.intervalo;
      caixa.replaceChildren(elemento("span", { className: "titulo", textContent: "Busca automática" }),
        elemento("span", { textContent: NOME_INTERVALO(a.intervalo).toLowerCase() }), proxima());
      return;
    }
    const lista = elemento("select", { id: "intervalo", title: "De quanto em quanto tempo o Merlin consulta a NASA sozinho" },
      ...a.intervalos.map(m => new Option(NOME_INTERVALO(m), m)));
    lista.value = String(a.intervalo);
    lista.setAttribute("aria-label", "Busca automática");
    const teste = elemento("input", { type: "checkbox", id: "modo-teste", checked: a.modo_teste });
    lista.onchange = teste.onchange = () => configurar(Number(lista.value), teste.checked);
    caixa.replaceChildren(
      elemento("span", { className: "titulo", textContent: "Busca automática" }), lista, proxima(),
      elemento("span", { className: "separa" }),
      elemento("label", { className: "chave", title: "Para testar o aviso várias vezes: antes de cada busca, apaga o CSV do robô e a última consulta" },
        teste, "Modo teste", elemento("small", { textContent: "· cada busca começa do zero" })));
    caixa.hidden = false;
  }

  async function configurar(intervalo, modoTeste) {
    const eraTeste = automatico.modo_teste;
    let r;
    try { r = await api().configurar(intervalo, modoTeste); } catch (e) { r = { erro: "Não consegui salvar a configuração." }; }
    if (r.erro) { avisar(r.erro, true); desenharAutomatico(); return; }
    automatico = r;
    desenharAutomatico();
    if (r.modo_teste && !eraTeste) avisar("Modo teste ligado: cada busca apaga o CSV do robô e a última consulta antes de rodar.");
    else if (!r.modo_teste && eraTeste) avisar("Modo teste desligado: o CSV volta a acumular as ocorrências.");
    else avisar(r.intervalo ? `Busca automática ${NOME_INTERVALO(r.intervalo).toLowerCase()}, próxima às ${r.proxima}.` : "Busca automática desligada.");
  }

  async function verificarAutomatico() {
    let a;
    try { a = await api().estado_automatico(); } catch (e) { return; }
    const primeira = !("versao" in automatico);
    automatico = a;
    // Na troca da configuração em outra tela, ou só para atualizar o horário da próxima
    if (!document.activeElement || document.activeElement.id !== "intervalo") desenharAutomatico();
    if (primeira) { versaoVista = a.versao; return; }  // o que já existia ao abrir a aba vem por carregarUltima
    if (a.versao > versaoVista) {
      const r = await api().mais_recente();
      if (r && Array.isArray(r.focos)) {
        mostrar(r);
        const hora = r.consultado_em.split(" às ")[1] || r.consultado_em;
        avisar(r.ativos ? `Busca automática das ${hora} chegou.` : `Busca automática das ${hora}: nenhum foco ativo.`);
      }
    } else if (!ultimo) {
      avisar(semConsulta());  // o horário da próxima busca muda: a mensagem acompanha
    }
  }
  // A aba fica escondida até ser aberta: ao aparecer, o mapa precisa medir o espaço de novo
  // Aba na tela: os alertas foram vistos, então o alarme para e a bolinha volta à cor normal.
  // (A Central monta todas as abas ao abrir: só conta quando o mapa tem tamanho, ou seja, quando aparece)
  const naTela = () => $("mapa").offsetWidth > 0 && document.visibilityState === "visible";
  function marcarVistos() {
    if (naTela() && window.pywebview && window.pywebview.api) api().vistos().catch(() => {});
  }
  new ResizeObserver(() => { mapa.invalidateSize(); enquadrar(); marcarVistos(); }).observe($("mapa"));
  document.addEventListener("visibilitychange", marcarVistos);
  window.addEventListener("pywebviewready", async () => {
    marcarVistos();
    escolherFundo();
    await verificarAutomatico();
    carregarUltima();
    setInterval(verificarAutomatico, 15000);
  });
</script>
</body>
</html>
